services:
  pipeline:
    build: .
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      GCDP_LOG_JSON: "true"
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "pipeline.run"]

  api:
    build: .
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - pipeline
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
